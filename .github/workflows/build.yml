name: Build and publish report

# report.html을 다시 만들어 검사하고, GitHub Pages가 켜져 있으면 배포한다.
# - main에 푸시했을 때
# - Refresh data가 끝났을 때 (봇이 올린 커밋은 push 이벤트를 일으키지 않으므로 workflow_run으로 받는다)
# Pages는 저장소 Settings → Pages → Source에서 "GitHub Actions"를 고르면 켜진다. 꺼져 있으면 배포만 건너뛴다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["Refresh data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 문법 검사
        run: python -m py_compile collect.py update_trades.py build_report.py
      - name: 리포트 생성
        run: python build_report.py
      - name: 결과 검사
        run: |
          if grep -q '/\*__DATA__\*/null' report.html; then echo "데이터가 리포트에 들어가지 않았습니다"; exit 1; fi
          test "$(wc -c < report.html)" -gt 100000
          python - <<'EOF'
          import json
          d = json.load(open("data/results.json", encoding="utf-8"))
          m = sum(1 for i in d["items"] if i.get("market"))
          print(f"공매 물건 {len(d['items'])}건 · 시세 비교 {m}건")
          assert len(d["items"]) >= 30 and m >= 10, "데이터가 비정상적으로 적습니다"
          EOF
      - name: 사이트 구성
        run: |
          mkdir -p _site/data
          cp report.html _site/index.html
          cp data/results.csv _site/data/results.csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.html
            data/results.csv

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages가 켜져 있는지 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages가 꺼져 있어 배포를 건너뜁니다 (응답 $code). Settings → Pages → Source에서 GitHub Actions를 선택하세요."
          fi
      - name: 배포
        id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
