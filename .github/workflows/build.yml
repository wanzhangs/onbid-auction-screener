name: Build report

# 코드나 데이터가 바뀌면 report.html을 다시 만들어 검사하고, 결과물을 Actions 아티팩트로 올린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 문법 검사
        run: python -m py_compile collect.py build_report.py
      - name: 리포트 생성
        run: python build_report.py
      - name: 결과 검사
        run: |
          if grep -q '/\*__DATA__\*/null' report.html; then echo "데이터가 리포트에 들어가지 않았습니다"; exit 1; fi
          test "$(wc -c < report.html)" -gt 100000
          python - <<'EOF'
          import json
          d = json.load(open("data/results.json", encoding="utf-8"))
          m = sum(1 for i in d["items"] if i.get("market"))
          print(f"공매 물건 {len(d['items'])}건 · 시세 비교 {m}건")
          assert len(d["items"]) >= 30 and m >= 10, "데이터가 비정상적으로 적습니다"
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.html
            data/results.csv
