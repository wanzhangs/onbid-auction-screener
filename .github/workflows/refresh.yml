name: Refresh data

# 온비드 공매 회차·국토부 실거래가·임대차 정보를 새로 수집해 data/와 report.html을 커밋한다.
# 매주 월요일 04:00(한국 시간)에 자동 실행되고, Actions 탭에서 수동으로도 실행할 수 있다. LLM API나 별도 키는 쓰지 않는다.
# 주의: GitHub 러너(해외 IP)에서 온비드·국토부 사이트가 응답하지 않을 수 있다. 그 경우 PC에서 실행해 푸시한다.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'   # 매주 월요일 04:00 (한국 시간, UTC 기준 일요일)

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 수집·매칭
        run: python collect.py
      - name: 수집 결과 검사
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("data/results.json", encoding="utf-8"))
          m = sum(1 for i in d["items"] if i.get("market"))
          print(f"공매 물건 {len(d['items'])}건 · 시세 비교 {m}건")
          assert len(d["items"]) >= 30 and m >= 10, "수집량이 비정상적으로 적어 커밋하지 않습니다"
          EOF
      - name: 리포트 생성
        run: python build_report.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/results.csv report.html
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)" && git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.html
            data/results.csv
